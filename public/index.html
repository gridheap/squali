<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/font-gate.js" data-kit="ggy5hcn"></script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Squali is a shared workspace for independent coding agents. Review intent, resolve conflicts, and publish compatible changes together.">
<title>Squali · Source control for parallel agents</title>
<link rel="stylesheet" href="/app.css">
<script src="/app.js" type="module"></script>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<a href="#" class="brand" aria-label="Squali home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M25 7H12a6 6 0 0 0 0 12h8a4 4 0 0 1 0 8H6M7 11l-3 2 3 2M25 19l3 2-3 2"/></svg><span data-font-gated>squali<span class="brand-dot">.</span></span></a>
<div class="workspace-label" data-font-gated>YOUR WORKSPACE</div>
<select id="workspace" aria-label="Current workspace"><option value="">Select workspace</option></select>
<nav aria-label="Workspace navigation">
<button class="nav-item active" data-view="changes"><span aria-hidden="true">⌘</span><span data-font-gated>Changes</span><span class="nav-count" id="nav-count">0</span></button>
<button class="nav-item" data-view="source"><span aria-hidden="true">▧</span><span data-font-gated>Source</span></button>
<button class="nav-item" data-view="history"><span aria-hidden="true">◷</span><span data-font-gated>History</span></button>
<button class="nav-item" data-view="cost"><span aria-hidden="true">◈</span><span data-font-gated>Cost & limits</span></button>
</nav>
<div class="sidebar-bottom"><div class="mini-graph" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p data-font-gated>Independent work.<br>Shared direction.</p><span class="version" data-font-gated>SQUALI / 0.1</span></div>
</aside>
<div class="main-shell">
<header class="topbar"><div class="breadcrumb" data-font-gated>Workspace <span>/</span> <strong id="crumb">Overview</strong></div><div class="top-actions"><span class="connection" id="connection">● Disconnected</span><button class="button small" id="connect-open" aria-label="Connect account"><span aria-hidden="true">↗</span><span data-font-gated>Connect</span></button></div></header>
<main>
<div id="status" role="status" aria-live="polite" class="status"></div>
<section class="page-head"><div><div class="eyebrow" data-font-gated><span class="live-dot"></span> BUILT FOR WORKING TOGETHER</div><h1 id="page-title" data-font-gated>Your next shared direction.</h1><p class="subtitle" id="subtitle" data-font-gated>A home for agent changes, context, and the decisions that connect them.</p></div><div class="head-actions"><button class="button" id="new-workspace" aria-label="New workspace"><span aria-hidden="true">＋</span><span data-font-gated>New workspace</span></button><button class="button primary" id="new-change" hidden aria-label="New change"><span aria-hidden="true">＋</span><span data-font-gated>New change</span></button></div></section>
<section id="content"></section>
<footer><span id="font-latin" data-font-gated>Built for independent minds.</span><span id="font-cjk" lang="zh-Hans">协作，让改变汇合。</span><span class="footer-state" id="mode">Connect to begin</span></footer>
</main>
</div>
</div>
<dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title" data-font-gated></h2><button class="icon-button" id="dialog-close" aria-label="Close details">×</button></div><div id="dialog-body"></div></dialog>
</body></html>
